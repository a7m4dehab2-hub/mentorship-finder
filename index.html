<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل الإرشاد الأكاديمي</title>
<style>
:root {color-scheme:light;--ink:#142a27;--muted:#4d655d;--green:#116456;--line:#d9e5dd;--paper:#f6f8f3}
* {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}
header {background:#123a34;color:white;padding:17px max(20px,calc((100vw - 840px)/2));display:flex;align-items:center;gap:12px;white-space:nowrap}
header svg {width:34px;height:34px;padding:7px;background:#28564d;border-radius:9px}
main {width:min(840px,calc(100% - 32px));margin:clamp(30px,7vw,76px) auto}
.kicker {color:var(--green);font-weight:bold;font-size:.95rem}
h1 {font-size:clamp(2rem,6vw,3.7rem);line-height:1.25;margin:9px 0 12px}
h2 {margin:0 0 10px;font-size:1.2rem}
p {margin:0;color:var(--muted)}
form,.card {background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(17px,3vw,27px)}
form {margin-top:25px;box-shadow:0 10px 35px #173d3010}
label {display:block;font-weight:bold;margin-bottom:7px}
.actions {display:flex;gap:10px;flex-wrap:wrap}
input,button {font:inherit;padding:10px 14px;border-radius:10px;min-height:48px}
input {background:#f9fbf8;color:var(--ink);border:1px solid #aabfb5;min-width:0;flex:1 1 185px;text-align:end}
#language {margin-inline-start:auto;min-height:36px;width:auto;background:#28564d;border:1px solid #70958d}
.source-text {text-align:start}
[dir=rtl] input {text-align:right}
[dir=ltr] input {text-align:left}
button {border:0;background:var(--green);color:white;font-weight:bold;cursor:pointer}
button:disabled {opacity:.65;cursor:wait}
:focus-visible {outline:3px solid #902e12;outline-offset:3px}
#message {margin-top:12px;color:#991f1f}
#message:empty {display:none}
#result {margin-top:24px}
.identity {background:#e7f1e9;margin-bottom:12px}
.grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.mentor {grid-column:1/-1;border-inline-start:5px solid var(--green)}
.coordinator {margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.coordinator strong {display:block}
.coordinator a {color:var(--green);display:inline-block;margin-inline-start:10px}
.value {color:var(--ink);font-size:1.13rem;font-weight:bold}
ul {list-style:none;padding:0;margin:0}
li {padding:9px 0;border-top:1px solid var(--line)}
@media(max-width:500px){.grid{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg><strong data-copy="brand">الإرشاد الأكاديمي</strong><button type="button" id="language" lang="en">English</button></header>
<main>
<p class="kicker" data-copy="year">العام الجامعي 2026–2027</p>
<h1 data-copy="title">دليل الإرشاد الأكاديمي</h1>
<p data-copy="intro">اعرف مرشدك، ومسؤوليك في قسمي الجراحة والباطنة، وزملاءك مع نفس المرشد.</p>
<form id="lookup">
<label for="student-id" data-copy="seatLabel">رقم الجلوس</label>
<div class="actions"><input id="student-id" dir="ltr" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="أدخل رقم الجلوس المكوّن من 8 أرقام" required><button data-copy="submit">عرض مجموعتي</button></div>
<p id="message" role="status"></p>
</form>
<section id="result" aria-labelledby="student-name" hidden>
<div class="card identity"><p id="department" dir="auto" class="source-text"></p><h2 id="student-name" dir="auto" class="source-text" tabindex="-1"></h2><p id="seat"></p></div>
<div class="grid">
<section class="card mentor"><h2 data-copy="mentor">المرشد الأكاديمي</h2><p class="value" id="mentor" dir="auto"></p><p id="detail" dir="auto" class="source-text"></p><p id="mentor_phone" dir="ltr"></p><div id="coordinator" class="coordinator" hidden><strong data-copy="coordinator">منسق الوحدة</strong><span id="coordinator-name" dir="auto"></span><a id="coordinator-phone" dir="ltr"></a></div></section>
<section class="card"><h2 data-copy="surgery">مسؤول الجراحة</h2><p class="value" id="surgery" dir="auto"></p><p id="surgery_detail" dir="auto" class="source-text"></p><p id="surgery_phone" dir="ltr"></p></section>
<section class="card"><h2 data-copy="medicine">مسؤول الباطنة</h2><p class="value" id="medicine" dir="auto"></p><p id="medicine_detail" dir="auto" class="source-text"></p><p id="medicine_phone" dir="ltr"></p></section>
</div>
<section class="card"><h2 id="peers-heading"></h2><ul id="peers"></ul><p id="empty-peers" hidden data-copy="empty">لا توجد أسماء زملاء مع نفس المرشد في الكشوف المتاحة لهذه الفرقة.</p></section>
</section>
</main>
<script src="./config.js"></script>
<script>
const api = window.MENTORSHIP_API;
if (api) fetch(api + '/activity', {method: 'POST', keepalive: true}).catch(() => {});
const get = (id) => document.getElementById(id);
const form = get('lookup');
const input = get('student-id');
const result = get('result');
const button = form.querySelector('button');
const unitCoordinators = new Map(Object.entries({
  "وحدة أ.د. منى حجازي": [
    "Dr Marwa El Shahat",
    "01093538742"
  ],
  "وحدة أ.د. محمد الباسل": [
    "Dr Ahmed AbdelGahni",
    "01501208045"
  ],
  "وحدة أ.د. ايمان رشدي": [
    "Dr Mona Khozam",
    "01112014548"
  ],
  "وحدة أ.د. احمد مراد هاشم": [
    "Dr Ahmed Lamuna",
    "01221619910"
  ],
  "وحدة أ.د. سحر الوكيل": [
    "Dr Sheimaa Meligy",
    "01015600682"
  ],
  "وحدة أ.د. سهام بكري": [
    "Dr. Shady",
    "01111580554"
  ],
  "وحدة أ.د. محمد رشدي المصري": [
    "Dr. Marwa Salah",
    "01224325725"
  ],
  "وحدة أ.د. سلوى إبراهيم": [
    "Dr Heba Wagdy",
    "01095933027"
  ]
}));
function coordinatorFor(data) {
  if (data.department !== 'الباطنة' || !data.mentor || !data.detail) return undefined;
  return unitCoordinators.get(data.detail.split('—').map(part => part.trim()).find(part => part.startsWith('وحدة ')));
}
const copy = {
  ar: {
    brand:'الإرشاد الأكاديمي', title:'دليل الإرشاد الأكاديمي', year:'العام الجامعي 2026–2027',
    intro:'اعرف مرشدك، ومسؤوليك في قسمي الجراحة والباطنة، وزملاءك مع نفس المرشد.',
    seatLabel:'رقم الجلوس', placeholder:'أدخل رقم الجلوس المكوّن من 8 أرقام', submit:'عرض مجموعتي',
    coordinator:'منسق الوحدة', mentor:'المرشد الأكاديمي', surgery:'مسؤول الجراحة', medicine:'مسؤول الباطنة',
    yearLabel:'الفرقة', missing:'غير مدرج', peers:'زملاء مع نفس المرشد',
    empty:'لا توجد أسماء زملاء مع نفس المرشد في الكشوف المتاحة لهذه الفرقة.',
    invalid_id:'أدخل رقم جلوس صحيحًا مكوّنًا من 8 أرقام.',
    unknown_id:'لم نجد رقم الجلوس في الكشوف المتاحة. تأكد من الرقم وحاول مرة أخرى.',
    too_many_requests:'تم إرسال طلبات كثيرة. انتظر دقيقة وحاول مرة أخرى.',
    unavailable:'تعذر تحميل النتيجة. حاول مرة أخرى.'
  },
  en: {
    brand:'Academic Mentorship', title:'Mentorship Finder', year:'Academic year 2026–2027',
    intro:'Find your academic mentor, Surgery and Internal Medicine contacts, and students assigned to the same mentor.',
    seatLabel:'Seat number', placeholder:'Enter your 8-digit seat number', submit:'Find my group',
    coordinator:'Unit coordinator', mentor:'Academic mentor', surgery:'Surgery contact', medicine:'Internal Medicine contact',
    yearLabel:'Year', missing:'Not listed', peers:'Students with the same mentor',
    empty:'The available records list no other students in this year with the same mentor.',
    invalid_id:'Enter a valid 8-digit seat number.',
    unknown_id:'That seat number was not found. Check the number and try again.',
    too_many_requests:'Too many requests. Wait one minute and try again.',
    unavailable:'Could not load the result. Please try again.'
  }
};
let lang = 'ar';
try { if (localStorage.getItem('mentorship-language') === 'en') lang = 'en'; } catch {}
let current = null;
let message = '';
let staff = {};
fetch('./staff-details.json')
  .then(response => { if (response.ok) return response.json(); })
  .then(data => { if (data) staff = data; if (current) renderResult(); })
  .catch(() => {});

function renderResult() {
  const data = current;
  const t = copy[lang];
  get('student-name').textContent = data.name;
  const department = get('department');
  department.replaceChildren(t.yearLabel + ' ');
  for (const [index, value] of [data.year, data.department].filter(Boolean).entries()) {
    if (index) department.append(' · ');
    const source = document.createElement('bdi');
    source.textContent = value;
    department.append(source);
  }
  const seat = document.createElement('bdi');
  seat.dir = 'ltr';
  seat.textContent = data.seat;
  get('seat').replaceChildren(t.seatLabel + ' ', seat);
  for (const field of ['mentor', 'surgery', 'medicine']) {
    get(field).textContent = data[field] || t.missing;
    get(field + '_phone').textContent = data[field + '_phone'] || '';
  }
  get('detail').textContent = data.detail || '';
  const coordinator = coordinatorFor(data);
  get('coordinator').hidden = !coordinator;
  if (coordinator) {
    const [name, phone] = coordinator;
    get('coordinator-name').textContent = name;
    get('coordinator-phone').textContent = phone;
    get('coordinator-phone').href = 'tel:+20' + phone.slice(1);
  }
  for (const field of ['surgery', 'medicine']) {
    get(field + '_detail').textContent = staff[field]?.[data[field]] || '';
  }
  get('peers-heading').textContent = t.peers + ' (' + data.peers.length + ')';
  get('peers').replaceChildren(...data.peers.map(({name, seat}) => {
    const item = document.createElement('li');
    const source = document.createElement('bdi');
    const number = document.createElement('bdi');
    source.textContent = name;
    number.dir = 'ltr';
    number.textContent = seat;
    item.append(source, ' · ', number);
    return item;
  }));
  get('empty-peers').hidden = data.peers.length !== 0;
}

function renderLanguage() {
  const t = copy[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.title;
  for (const element of document.querySelectorAll('[data-copy]')) {
    element.textContent = t[element.dataset.copy];
  }
  input.placeholder = t.placeholder;
  const toggle = get('language');
  toggle.lang = lang === 'ar' ? 'en' : 'ar';
  toggle.textContent = lang === 'ar' ? 'English' : 'العربية';
  get('message').textContent = message ? t[message] : '';
  if (current) renderResult();
}
function showMessage(key) {
  message = key;
  get('message').textContent = key ? copy[lang][key] : '';
}
get('language').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('mentorship-language', lang); } catch {}
  renderLanguage();
});
renderLanguage();

input.addEventListener('input', () => {
  result.hidden = true;
  current = null;
  showMessage('');
});
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  result.hidden = true;
  current = null;
  showMessage('');
  button.disabled = true;
  input.readOnly = true;
  try {
    if (!api) throw new Error('Lookup service has not been configured');
    const response = await fetch(api + '/lookup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: input.value})
    });
    const data = await response.json();
    if (!response.ok) {
      const key = data.error;
      showMessage(['invalid_id', 'unknown_id', 'too_many_requests'].includes(key) ? key : 'unavailable');
      input.focus();
      return;
    }
    current = data;
    renderResult();
    result.hidden = false;
    get('student-name').focus();
  } catch {
    showMessage('unavailable');
  } finally {
    button.disabled = false;
    input.readOnly = false;
  }
});
</script>
</body>
</html>
